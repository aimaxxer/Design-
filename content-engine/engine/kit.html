<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 10X Affiliation layout families: same tokens as the carousel system, new grounds and compositions. */
:root{
  --navy:#154359; --navy2:#3f6274; --navy3:#557080; --deep:#185b7b; --teal:#066377; --sky:#4bbdf0;
  --mist:#eef1ee; --frost:#f0f5f7; --white:#ffffff; --line:#d7e2e7; --line2:#b7cbd3; --neg:#b42318; --pale:#8fb0bd;
  --bg:var(--mist); --ink:var(--navy); --ink2:var(--navy2); --ink3:var(--navy3); --card:#fff; --rule:var(--line); --rule2:var(--line2); --accent:var(--teal);
  --grad:linear-gradient(100deg,var(--sky) 0%,#2a8fc0 45%,var(--deep) 100%);
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:var(--font)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.slide.story{height:1920px}
/* grounds */
.t-white{--bg:#fbfcfc}
.t-sky{--bg:#e3eef1;background:linear-gradient(170deg,#eaf3f6 0%,#d6e8ef 100%)}
.t-navy,.t-deep{--ink:#fff;--ink2:#c6d7df;--ink3:#8fb0bd;--card:#1b4b62;--rule:rgba(183,203,211,.25);--rule2:rgba(183,203,211,.45);--accent:var(--sky);--grad:linear-gradient(100deg,#bfeafc 0%,var(--sky) 100%)}
.t-navy{background:radial-gradient(110% 70% at 85% 0%,#1f5f7d 0%,#154359 48%,#0e3245 100%)}
.t-deep{background:linear-gradient(160deg,#0a7189 0%,#066377 40%,#0b4a5f 100%)}
/* chrome */
.hd{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.logo{display:flex;align-items:center;gap:16px;color:var(--ink)}
.logo svg{height:38px;width:auto;display:block}
.logo .lt{display:flex;flex-direction:column;gap:3px}
.logo .lt b{font-size:25px;font-weight:600;line-height:1}
.logo .lt span{font-size:20px;font-weight:300;line-height:1;color:var(--ink2)}
.tag{font-size:18px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ink2)}
.ft{position:absolute;left:80px;right:80px;bottom:66px;display:flex;justify-content:space-between;align-items:flex-end;gap:48px;z-index:9}
.ft .note{font-size:17px;line-height:1.45;color:var(--ink3);max-width:620px}
.ft .go{margin-left:auto;font-size:18px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:14px;white-space:nowrap}
.eyebrow{font-size:20px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.h{font-weight:700;text-transform:uppercase;letter-spacing:-.022em;line-height:.97;color:var(--ink);text-wrap:balance}
.h .m{color:var(--ink3)}
.t-navy .h .m,.t-deep .h .m{color:var(--pale)}
.body{font-size:31px;line-height:1.45;color:var(--ink2);text-wrap:pretty}
.body b{color:var(--ink);font-weight:600}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.abs{position:absolute}
.cut{clip-path:polygon(var(--c,24px) 0,100% 0,100% calc(100% - var(--c,24px)),calc(100% - var(--c,24px)) 100%,0 100%,0 var(--c,24px))}
.btn{display:inline-flex;align-items:center;gap:22px;background:var(--teal);color:#fff;font-size:23px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:30px 44px;--c:16px}
.t-navy .btn,.t-deep .btn{background:#fff;color:var(--navy)}
.checks{display:flex;flex-wrap:wrap;gap:14px 30px;font-size:18px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.checks span{display:flex;align-items:center;gap:10px}
.checks svg{color:var(--accent)}
img.fill{width:100%;height:100%;object-fit:cover;display:block}
.fade{-webkit-mask-image:radial-gradient(closest-side,#000 66%,transparent 100%);mask-image:radial-gradient(closest-side,#000 66%,transparent 100%)}

.mark-out svg{width:100%;height:auto;display:block}
.kbadge{position:absolute;width:210px;height:210px;z-index:5;transform:rotate(-14deg)}
.kbadge svg{width:100%;height:100%;display:block}
.kbadge .bg{fill:var(--sky)}.kbadge .tx{fill:var(--navy)}.kbadge .mk{color:var(--navy)}
/* A manifesto */
.mani .h{font-size:150px;line-height:.9;letter-spacing:-.035em}
/* D ruler */
.ruler{position:relative;height:120px}
.ruler .base{position:absolute;left:0;right:0;top:60px;height:2px;background:rgba(255,255,255,.4)}
.ruler i{position:absolute;top:44px;width:2px;height:34px;background:rgba(255,255,255,.55)}
.ruler i.s{top:52px;height:18px;opacity:.6}
.ruler span{position:absolute;top:92px;transform:translateX(-50%);font-size:18px;letter-spacing:.14em;color:var(--ink3)}
.ruler .fillbar{position:absolute;left:0;top:56px;height:10px;background:linear-gradient(90deg,rgba(255,255,255,.35),#bfeafc)}
.ruler .pin{position:absolute;top:0;transform:translateX(-50%);font-size:18px;font-weight:600;letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.14);padding:8px 12px}
/* E phone */
.phone{position:absolute;width:520px;height:1040px;border-radius:78px;background:#0f2f40;padding:18px;box-shadow:0 60px 120px rgba(21,67,89,.28),0 0 0 2px rgba(255,255,255,.4) inset}
.phone .scr{position:relative;width:100%;height:100%;border-radius:62px;overflow:hidden;background:linear-gradient(180deg,#cfe4ec 0%,#eef4f6 60%)}
.phone .island{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:150px;height:42px;border-radius:24px;background:#0f2f40}
.phone .time{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:110px;font-weight:300;color:var(--navy);letter-spacing:-.03em}
.phone .date{position:absolute;left:0;right:0;top:100px;text-align:center;font-size:22px;font-weight:500;color:var(--navy2)}
.notif{position:absolute;left:22px;right:22px;background:rgba(255,255,255,.86);border-radius:30px;padding:22px 24px;display:flex;gap:18px;box-shadow:0 10px 30px rgba(21,67,89,.12)}
.notif .ic{width:58px;height:58px;border-radius:14px;background:var(--navy);display:grid;place-items:center;flex:none;color:#fff}
.notif .ic svg{width:38px;height:auto}
.notif .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.notif .tx b{font-size:21px;font-weight:600;color:#0f2f40}
.notif .tx span{font-size:20px;line-height:1.3;color:#2b4b5b}
.notif .when{margin-left:auto;font-size:17px;color:#557080;flex:none}
/* F myth/fact */
.mf{position:absolute;left:80px;right:80px}
.mf .lab{font-size:20px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.mf.myth .q{font-size:92px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:.98;color:var(--ink3);text-decoration:line-through;text-decoration-thickness:8px;text-decoration-color:var(--neg)}
.mf.fact{background:var(--navy);color:#fff;padding:56px 56px 60px;--c:40px}
.mf.fact .lab{color:var(--sky)}
.mf.fact .a{font-size:52px;font-weight:400;line-height:1.25;letter-spacing:-.01em;margin-top:22px}
.mf.fact .a b{font-weight:700}
/* G ticker */
.band{position:absolute;left:-200px;right:-200px;white-space:nowrap;font-size:30px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;padding:22px 0;overflow:hidden}
/* H quote */
.qmark{font-size:520px;line-height:.7;font-weight:700;letter-spacing:-.05em;height:300px}
/* I bento */
.bento{position:absolute;left:80px;right:80px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bento .tile{background:#fff;--c:26px;padding:24px 26px 26px;display:flex;flex-direction:column;gap:8px;height:360px;position:relative}
.bento .tile img{width:180px;height:180px;align-self:flex-end;margin:-10px -6px 0 0}
.bento .tile b{font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.bento .tile span{font-size:22px;line-height:1.35;color:var(--ink3)}
.bento .tile .k{font-size:15px;font-weight:600;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
/* J timeline */
.tl{position:absolute;left:80px;right:80px}
.tl .row{display:grid;grid-template-columns:190px 44px 1fr;gap:24px;align-items:start;padding-bottom:64px;position:relative}
.tl .row .when{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:right;padding-top:8px}
.tl .row .dot{width:44px;height:44px;border:2px solid var(--teal);background:var(--bg);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--teal);position:relative;z-index:2}
.tl .row.last .dot{background:var(--teal);color:#fff}
.tl .line{position:absolute;left:235px;top:22px;bottom:68px;width:2px;background:var(--line2);z-index:1}
.tl .row b{display:block;font-size:40px;font-weight:700;text-transform:uppercase;letter-spacing:-.015em;line-height:1}
.tl .row span{display:block;font-size:24px;line-height:1.35;color:var(--ink3);margin-top:10px}
/* K chart */
.chart{position:absolute;left:80px;right:80px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:stretch;gap:20px}
.chart .bar{position:relative;background:var(--line2)}
.chart .bar.g{background:var(--grad)}
.chart .bar .ext{position:absolute;left:0;right:0;bottom:100%;background:repeating-linear-gradient(135deg,rgba(75,189,240,.55) 0 10px,rgba(75,189,240,.18) 10px 20px)}
.chart .v{font-size:110px;font-weight:600;letter-spacing:-.04em;line-height:1}
.chart .l{font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border-top:2px solid var(--ink);padding-top:16px}
/* M logos */
.logos{display:flex;gap:46px;align-items:center;flex-wrap:wrap}
.logos div{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;color:var(--ink)}
.logos img{height:64px;width:auto;display:block}
/* L poll */
.poll{position:absolute;left:110px;right:110px;background:#fff;border-radius:36px;padding:40px 36px;box-shadow:0 30px 80px rgba(21,67,89,.16)}
.poll .q{font-size:40px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;text-align:center;margin-bottom:28px}
.poll .o{display:flex;align-items:center;gap:18px;border:2px solid var(--line);border-radius:22px;padding:22px 26px;font-size:28px;font-weight:500;margin-top:14px}
.poll .o i{font-style:normal;width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--teal);flex:none}
</style></head>
<body><div id="stage"></div>
<script>
const MARK = '<svg viewBox="95 204 1120 464" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M95 282L205 212H294V658H200V302L95 366Z M557 206C669.2 206 738 293.8 738 437C738 580.2 669.2 668 557 668C444.8 668 376 580.2 376 437C376 293.8 444.8 206 557 206Z M557 284C607.4 284 641 345.2 641 437C641 528.8 607.4 590 557 590C506.6 590 473 528.8 473 437C473 345.2 506.6 284 557 284Z M773 204H889L1215 650H1101Z M1101 204H1215L1107 350H996Z M878 507H995L889 650H773Z"/></svg>';

const ARROW_UP = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14L14 4M6 4h8v8"/></svg>';
const ARROW = '<svg width="64" height="16" viewBox="0 0 64 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M0 8h62M55 1l7 7-7 7"/></svg>';
const CHECK = (s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9.5l4 4 8-9"/></svg>`;
const BADGE = (pos) => `<div class="kbadge" style="${pos}"><svg viewBox="0 0 200 200"><defs><path id="kbp" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><circle cx="100" cy="100" r="99" class="bg"/><text font-size="13" font-weight="600" class="tx"><textPath href="#kbp" textLength="486" lengthAdjust="spacing">NO FEES • OFFER WITHIN 1 HOUR • KEEP YOUR BROKER • </textPath></text><g class="mk" transform="translate(62,84) scale(.068) translate(-95,-204)">${MARK.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g></svg></div>`;

const checks = a => `<div class="checks">${a.map(c=>`<span>${CHECK(16)}${c}</span>`).join('')}</div>`;
const IND = 'Individual results depend on volume and client activity.';

const S = {
// A. Manifesto: type is the image
'a-manifesto': { tone:'navy', html: () => hd('Sound familiar?') +
  `<div class="abs" style="left:80px;right:60px;top:250px"><div class="h mani" style="font-size:128px;line-height:.9;letter-spacing:-.035em">Good IBs were never the problem. <span class="m">The structure was.</span></div></div>
   <div class="abs body" style="left:80px;right:340px;bottom:170px;font-size:28px">Six walls you hit while scaling. Solved by one partner.</div>` + `<div style="position:absolute;right:50px;bottom:110px;width:290px;height:290px;z-index:5"><img src="art/coin-a.png" alt="" style="width:100%;height:100%;display:block;filter:drop-shadow(0 24px 34px rgba(4,30,44,.35))"></div>` + ft(null) },
// B. Photo split
'b-split': { tone:'navy', html: () =>
  `<div class="abs" style="left:0;right:0;bottom:0;height:560px"><img class="fill" src="art/hero2.jpg" style="object-position:30% 50%"></div>
   <div class="abs" style="left:0;right:0;bottom:560px;height:4px;background:var(--sky)"></div>
   <div class="abs" style="left:0;right:0;bottom:0;height:200px;background:linear-gradient(to top,rgba(14,50,69,.85),rgba(14,50,69,0))"></div>` + hd('Partner deals') +
  `<div class="abs" style="left:80px;right:80px;top:200px;display:flex;flex-direction:column;gap:28px"><div class="h" style="font-size:96px">Your volume grows. <span class="m">Your deal doesn't.</span></div>
   <p class="body">We negotiate with the combined volume of all our partners, so you keep <b>on average 40% more per lot</b>.</p></div>` + ft('Average uplift across partners. Your offer depends on your flow.') },
// C. Object hero on white
'c-object': { tone:'white', html: () => hd('Retention') +
  `<div class="abs" style="left:110px;top:150px;width:860px;height:860px"><img class="fill fade" src="art/g3.jpg"></div>
   <div class="abs" style="left:80px;right:80px;bottom:170px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px">
     <div class="h" style="font-size:78px">Your referrals<br>are your assets.</div>
     <div style="font-size:18px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);text-align:right;line-height:1.8;white-space:nowrap">Copy trading<br>PAMM<br>10X Trader</div></div>` + ft(null) },
// D. Big stat with ruler on deep teal
'd-ruler': { tone:'deep', html: () => hd('Commercials') +
  `<div class="abs" style="left:80px;right:80px;top:250px"><div class="eyebrow" style="color:#bfeafc">The average uplift</div>
     <div class="grad" style="font-size:320px;font-weight:300;letter-spacing:-.06em;line-height:.95;margin-left:-14px;width:max-content;padding-right:.05em">+40%</div>
     <div style="font-size:60px;font-weight:400;letter-spacing:-.02em;line-height:1.1;color:#fff;margin-top:10px">more per lot for our partners.</div></div>
   <div class="abs ruler" style="left:110px;right:130px;top:1000px"><div class="base"></div><div class="fillbar" style="width:80%"></div>

     ${[5,15,25,35,45].map(v=>`<i class="s" style="left:${v*2}%"></i>`).join('')}
     <div class="pin" style="left:80%">Avg. partner</div></div>` + ft('Average uplift across partners. Your offer depends on your flow.') },
// E. Phone notification mock
'e-phone': { tone:'sky', html: () => hd('How it works') +

     ${checks(['No fees','Keep your broker'])}</div>
   <div class="phone" style="right:-40px;top:200px"><div class="scr"><div class="island"></div>
     <div class="date">Tuesday</div><div class="time">14:32</div>
     <div class="notif" style="top:330px"><div class="ic">${MARK}</div><div class="tx"><b>10X Affiliation</b><span>Your new rebate offer is ready. Tap to review.</span></div><span class="when">now</span></div>
     <div class="notif" style="top:490px;opacity:.75"><div class="ic">${MARK}</div><div class="tx"><b>10X Affiliation</b><span>Strategy call confirmed. Your partner manager will call you.</span></div><span class="when">1h ago</span></div>
     <div style="position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#557080">Example notifications</div>
   </div></div>` + ft(IND) },
// F. Myth / fact
'f-mythfact': { tone:'mist', html: () => hd('Myth vs. reality') +
  `<div class="mf myth" style="top:230px"><div class="lab" style="color:var(--neg)">Myth</div><div class="q" style="margin-top:20px">“It takes weeks.”</div></div>
   <div class="mf fact cut" style="top:560px"><div class="lab">Fact</div><div class="a"><b>1 hour.</b> That's how long it takes to get your new offer after the call.</div></div>
   <div class="abs" style="right:-60px;bottom:150px;width:440px;height:440px"><img class="fill fade" src="art/g5.jpg"></div>` + ft(null,'Swipe') },
// G. Ticker bands
'g-ticker': { tone:'navy', html: () => {
  const t = 'No fees · Offer within 1 hour · 2-minute application · Keep your broker · ';
  const band = (top, rot, op, bg) => `<div class="band" style="top:${top}px;transform:rotate(${rot}deg);color:${op};background:${bg}">${t.repeat(4)}</div>`;
  return hd('Straight answers') + band(230,-6,'rgba(143,176,189,.55)','transparent') + band(1010,-6,'#0e3245','var(--sky)') + band(1110,-6,'rgba(143,176,189,.45)','transparent') +
  `<div class="abs" style="left:80px;right:80px;top:420px"><div class="h" style="font-size:118px">No fees. <span class="m">The broker pays us, not you.</span></div>
   <p class="body" style="margin-top:30px">We only earn when your flow does.</p></div>` + ft(null); } },
// H. Quote card
'h-quote': { tone:'white', html: () => hd('Retention') +
  `<div class="abs grad qmark" style="left:60px;top:170px">“</div>
   <div class="abs" style="left:80px;right:80px;top:470px"><div style="font-size:86px;font-weight:400;letter-spacing:-.03em;line-height:1.06;color:var(--navy);text-wrap:balance">Your referrals are your assets. <span style="color:var(--navy3)">Let's make them pay.</span></div>

   <div class="abs" style="right:-70px;bottom:150px;width:440px;height:440px"><img class="fill fade" src="art/g10.jpg"></div>` + ft(null) },
// I. Bento with glass icons
'i-bento': { tone:'mist', html: () => hd('Partner stack') +
  `<div class="abs" style="left:80px;right:80px;top:200px"><div class="h" style="font-size:72px">Deals, products, funnels. <span class="m">One partner.</span></div></div>
   <div class="bento" style="top:470px">
   ${[['coins3d','01 · Earn more','Better rebate deals','On average 40% more per lot.'],['magnet','02 · Attract','More leads','Marketing, UGC & done-for-you ads.'],['funnel','03 · Convert','Funnels that convert','Pages and follow-ups built for you.'],['key','04 · Product','10X Trader','10x buying power from day one.']]

   </div>` + ft('No fees: the broker pays us, not you.') },

window.renderSample = async (id) => {
  const s = S[id];

// Always write IB’s, with the ’s kept lowercase even inside all-caps headings.
function fixIB(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const hits = [];
  while (w.nextNode()) if (/\bIB(s|'s|’s)\b/.test(w.currentNode.nodeValue)) hits.push(w.currentNode);
  for (const n of hits){
    const parts = n.nodeValue.split(/\bIB(?:s|'s|’s)\b/); const frag = document.createDocumentFragment();
    const wrap = document.createElement('span');
    parts.forEach((p, i) => { wrap.append(p); if (i < parts.length - 1){ wrap.append('IB'); const sp = document.createElement('span'); sp.style.textTransform = 'none'; sp.textContent = '’s'; wrap.append(sp); } });
    n.replaceWith(wrap);
  }
}
  document.getElementById('stage').innerHTML = `<div class="slide t-${s.tone}${s.story?' story':''}" id="slide">${s.html()}</div>`;
  fixIB(document.getElementById('stage'));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const el = document.getElementById('slide'); const b = el.getBoundingClientRect(); const issues = [];
  el.querySelectorAll('.h,.body,.tile,.notif,.poll,.ft,.hd,.checks').forEach(n => { const r = n.getBoundingClientRect(); if (r.right > b.right + 1 && !n.closest('.band')) issues.push('x ' + n.className); if (r.bottom > b.bottom + 1) issues.push('y ' + n.className); });
  return { issues, h: b.height };
};
window.ids = Object.keys(S);
